# pyproject.toml
# UV Package Manager Configuration

[project]
name = "retail-branch-demo"
version = "1.0.0"
description = "Retail Branch Management System"
authors = [
    {name = "Retail Branch Team", email = "team@retailbranch.com"}
]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.121.1",
    "uvicorn[standard]==0.38.0",
    "jinja2==3.1.6",
    "authlib==1.6.5",
    "itsdangerous==2.2.0",
    "google-cloud-bigquery==3.38.0",
    "google-cloud-storage==3.5.0",
    "google-cloud-secret-manager==2.22.0",
    "sendgrid==6.13.0",
    "pydantic==2.10.7",
    "email-validator==2.2.0",
    "python-dotenv==1.2.1",
    "python-magic==0.4.27",
    "bleach==6.2.0",
    "python-multipart==0.0.9",
    "httpx==0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest==9.0.1",
    "pytest-asyncio==0.25.2",
    "black==25.1.0",
    "flake8==7.1.1",
    "mypy==1.15.0",
]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
